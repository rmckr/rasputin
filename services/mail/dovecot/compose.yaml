services:
  dovecot:
    container_name: dovecot
    image: dovecot/dovecot:2.4.4
    restart: unless-stopped
    healthcheck:
      # doveinfo talks to the running master; fails if it is down
      test: ["CMD", "doveadm", "exec", "doveinfo"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mail_archive
    ports:
      - "143:31143"
    environment:
      USER_PASSWORD: "{PLAIN}${DOVECOT_PASSWORD:?error}"
    volumes:
      - ./dovecot.conf:/etc/dovecot/conf.d/custom.conf:ro
      - ../../../data/dovecot/mail:/srv/vmail
      - ../../../data/dovecot/indexes/:/var/indexes
    labels:
      docs.description: "Local mailserver only used for archiving mails, only accessible via VPN or LAN, no external SMTP"

networks:
  mail_archive:
    external: true
