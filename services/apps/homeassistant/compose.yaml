services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - ../../../data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host
    labels:
      docs.description: "Home Assistant instance, running in host networking mode"

      traefik.enable: "true"
      traefik.http.services.homeassistant.loadbalancer.server.port: 8123

      traefik.http.routers.ha-internal.rule: Host(`home.${HOMELAB_DOMAIN}`)
      traefik.http.routers.ha-internal.entrypoints: websecure
      traefik.http.routers.ha-internal.tls: "true"
      traefik.http.routers.ha-internal.service: homeassistant

      traefik.http.routers.ha-external.rule: Host(`${HOMEASSISTANT_HOST:?error}`)
      traefik.http.routers.ha-external.entrypoints: websecure
      traefik.http.routers.ha-external.tls.certresolver: letsencrypt
      traefik.http.routers.ha-external.service: homeassistant
      traefik.http.routers.ha-external.middlewares: ha-sec
      traefik.http.middlewares.ha-sec.headers.sslRedirect: "true"
      traefik.http.middlewares.ha-sec.headers.stsSeconds: "63072000"

      homepage.group: Apps
      homepage.name: Home Assistant
      homepage.icon: home-assistant
      homepage.href: https://home.${HOMELAB_DOMAIN}
      homepage.description: Home Automation

  matterjs-server:
    container_name: matterjs-server
    image: ghcr.io/matter-js/matterjs-server:latest
    read_only: true
    network_mode: host
    restart: unless-stopped
    volumes:
      - "../../../data/matterjs-server:/data"
    environment:
      PRIMARY_INTERFACE: ${HOMELAB_LAN_INTERFACE}
    labels:
      docs.description: "Used for matter support, in the same compose file as homeassistant"
      