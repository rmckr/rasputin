services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    networks:
      - proxy
    environment:
      - PUID=${HOMELAB_PUID}
      - PGID=${HOMELAB_PGID}
      - TZ=${HOMELAB_TZ}
      - PASSWORD=${CODE_SERVER_PASSWORD:?error}
      - SUDO_PASSWORD=${CODE_SERVER_SUDO_PASSWORD:?error}
      - PROXY_DOMAIN=code.${HOMELAB_DOMAIN}
      - DEFAULT_WORKSPACE=/config/workspace
      - PWA_APPNAME=code-server
    volumes:
      - ../../../data/code-server:/config
      - ../../..:/config/workspace
    restart: unless-stopped
    labels:
      docs.description: "VSCode server for debugging and working on the homelab from any device"

      traefik.enable: "true"
      traefik.docker.network: proxy

      traefik.http.routers.code-server.rule: Host(`code.${HOMELAB_DOMAIN}`)
      traefik.http.routers.code-server.entrypoints: websecure
      traefik.http.routers.code-server.tls: "true"

      traefik.http.services.code-server.loadbalancer.server.port: 8443

      homepage.group: Tooling
      homepage.name: Code Server
      homepage.icon: coder-light
      homepage.href: https://code.${HOMELAB_DOMAIN}
      homepage.description: Browser IDE
