services:
  cert-server:
    image: python:3.12-alpine
    container_name: cert-server
    command: sh -c "cd /cert && python -m http.server 8080"
    networks:
      - proxy
    volumes:
      # CA cert is public config, so it lives in git and is served straight
      # from here; the CA *key* stays under data/certs/ca, never committed.
      # Mount the dir, not the file: a missing file would become an empty dir.
      - ./ca:/cert:ro
    restart: unless-stopped
    healthcheck:
      # alpine busybox wget
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/rasputinCA.crt"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      docs.description: "Tiny web server that allows LAN clients to download local CA certs for trusting traefik"

      traefik.enable: true
      traefik.docker.network: proxy

      traefik.http.routers.cert-server.rule: Host(`certs.${HOMELAB_DOMAIN}`)
      traefik.http.routers.cert-server.entrypoints: websecure
      traefik.http.routers.cert-server.tls: true

      traefik.http.services.cert-server.loadbalancer.server.port: 8080

      homepage.group: Tooling
      homepage.name: Certificate Server
      homepage.icon: mdi-certificate
      homepage.href: https://certs.${HOMELAB_DOMAIN}
      homepage.description: Local CA Certificates

networks:
  proxy:
    external: true
