services:
  wireguard:
    container_name: wireguard
    image: ghcr.io/wg-easy/wg-easy:15
    network_mode: host
    environment:
      # See: https://wg-easy.github.io/wg-easy/latest/advanced/config/optional-config/
      # And: https://wg-easy.github.io/wg-easy/latest/advanced/config/unattended-setup/
      PORT: 47112
      INIT_ENABLED: true
      INIT_USERNAME: ${WG_USERNAME:?error}
      INIT_PASSWORD: ${WG_PASSWORD:?error}
      INIT_HOST: ${WG_HOST:?error}
      INIT_PORT: 47111
      INIT_DNS: 192.168.188.3, fdff:150a:4884::3
      INIT_IPV4_CIDR: 10.100.0.0/24
      INIT_IPv6_CIDR: fd00:10:100::/64
      INIT_ALLOWED_IPS: 0.0.0.0/0, ::/0
    volumes:
      - ../../../data/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    labels:
      docs.description: "Implemented with wg-easy, used for VPN access to traefik and LAN, running in host networking mode"

      traefik.enable: "true"
      traefik.docker.network: proxy

      traefik.http.routers.wireguard.rule: Host(`wireguard.rasputin.pi`)
      traefik.http.routers.wireguard.entrypoints: websecure
      traefik.http.routers.wireguard.tls: "true"

      traefik.http.services.wireguard.loadbalancer.server.port: 47112

      homepage.group: Network
      homepage.name: WireGuard
      homepage.icon: wireguard
      homepage.href: https://wireguard.rasputin.pi
      homepage.description: VPN

      homepage.widget.type: wgeasy
      homepage.widget.url: http://wireguard
      version: 2
      username: ${WG_USERNAME:?error}
      password: ${WG_PASSWORD:?error}
