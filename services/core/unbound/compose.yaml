services:
  unbound:
    container_name: unbound
    image: klutchell/unbound:latest
    networks:
      - dns
    restart: unless-stopped
    healthcheck:
      # image is FROM scratch (no shell); drill ships with the image.
      # Answering a root SOA means recursion to the roots works.
      test: ["CMD", "drill", "@127.0.0.1", ".", "SOA"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./unbound.conf:/etc/unbound/custom.conf.d/unbound.conf:ro
    labels:
      docs.description: "Upstream DNS for pihole, also used by rspamd"

networks:
  dns:
    external: true