server:
  interface: 0.0.0.0
  port: 53

  access-control: 0.0.0.0/0 allow

  # Performance
  prefetch: yes
  num-threads: 2

  # Sensible caching
  cache-min-ttl: 300
  cache-max-ttl: 86400

  # Hygiene
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes

  verbosity: 3
  log-queries: yes
  log-replies: yes
