services:
  pihole:
    container_name: pihole
    hostname: pihole-docker
    image: pihole/pihole:2026.02.0
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    networks:
      - proxy
      - dns
      - pihole
    environment:
      # See: https://docs.pi-hole.net/docker/configuration
      FTLCONF_dhcp_active: "false"
      FTLCONF_misc_dnsmasq_lines: "address=/.${HOMELAB_DOMAIN}/${HOMELAB_HOST_IP}"
      FTLCONF_dns_domain: "${HOMELAB_ROUTER_DOMAIN}"
      FTLCONF_dns_hosts: "${HOMELAB_HOST_IP} ${HOMELAB_DOMAIN}"
      FTLCONF_dns_listeningMode: "all"
      FTLCONF_dns_revServers: "true,${HOMELAB_LAN_CIDR},${HOMELAB_ROUTER_IP},${HOMELAB_ROUTER_DOMAIN}"
      FTLCONF_dns_upstreams: "unbound;"
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?error}
      FTLCONF_webserver_port: "8080o,8443os,[::]:8080o,[::]:8443os"
      TZ: "${HOMELAB_TZ}"
    cap_add:
      - SYS_NICE
    restart: unless-stopped
    healthcheck:
      # bash /dev/tcp - the image ships no guaranteed curl/wget
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./whitelist.sh:/pihole/whitelist.sh
    post_start:
      # Whitelist
      - command: [ "sh", "-c", "/pihole/whitelist.sh" ]
    labels:
      docs.description: "Used for local DNS for all machines in network, distributed by router DHCP"

      traefik.enable: "true"

      traefik.http.routers.pihole.rule: Host(`pihole.${HOMELAB_DOMAIN}`) || Host(`${HOMELAB_HOST_IP}`)
      traefik.http.routers.pihole.entrypoints: websecure
      traefik.http.routers.pihole.tls: "true"

      traefik.http.services.pihole.loadbalancer.server.port: 8080

      traefik.http.middlewares.pihole-admin.redirectregex.regex: "^https?://pihole.${HOMELAB_DOMAIN}/?$"
      traefik.http.middlewares.pihole-admin.redirectregex.replacement: "https://pihole.${HOMELAB_DOMAIN}/admin"
      traefik.http.middlewares.pihole-admin.redirectregex.permanent: "true"
      traefik.http.routers.pihole.middlewares: pihole-admin

      homepage.group: Network
      homepage.name: Pi-hole
      homepage.icon: pi-hole
      homepage.href: https://pihole.${HOMELAB_DOMAIN}
      homepage.description: DNS & Ad Blocking

      homepage.widget.type: pihole
      homepage.widget.url: http://pihole:8080
      homepage.widget.version: 6
      homepage.widget.key: ${PIHOLE_PASSWORD}

networks:
  proxy:
    external: true
  dns:
    external: true
  pihole:
    external: true
