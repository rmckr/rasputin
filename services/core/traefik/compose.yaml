services:
  traefik:
    container_name: traefik
    image: traefik:latest
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--entryPoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entryPoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?error}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--log.level=DEBUG"
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./tls.yml:/etc/traefik/dynamic/tls.yml:ro"
      - "../../../data/certs/internal:/certs:ro"
      - "../../../data/traefik/acme.json:/letsencrypt/acme.json"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    labels:
      docs.description: "Routing for all running docker services"

      traefik.enable: "true"

      traefik.http.routers.traefik.rule: Host(`traefik.${HOMELAB_DOMAIN}`)
      traefik.http.routers.traefik.service: api@internal
      traefik.http.routers.traefik.entrypoints: websecure
      traefik.http.routers.traefik.tls: "true"

      # traefik.http.routers.root-redirect.rule: Host(`rasputin.pi`)
      # traefik.http.routers.root-redirect.service: noop@internal
      # traefik.http.routers.root-redirect.entrypoints: websecure
      # traefik.http.routers.root-redirect.tls: true
      # traefik.http.routers.root-redirect.middlewares: root-redirect
      # traefik.http.routers.root-redirect.priority: 100
      # traefik.http.middlewares.root-redirect.redirectregex.regex: "^https?://.*"
      # traefik.http.middlewares.root-redirect.redirectregex.replacement: "https://grafana.rasputin.pi"

      homepage.group: Network
      homepage.name: Traefik
      homepage.icon: traefik
      homepage.href: https://traefik.${HOMELAB_DOMAIN}
      homepage.description: Reverse Proxy

      homepage.widget.type: traefik
      homepage.widget.url: http://traefik:8080

networks:
  proxy:
    external: true
