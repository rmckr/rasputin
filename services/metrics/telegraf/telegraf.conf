[global_tags]
[agent]
    interval = "10s"
    round_interval = true
    metric_batch_size = 1000
    metric_buffer_limit = 10000
    collection_jitter = "0s"
    flush_interval = "10s"
    flush_jitter = "0s"
    precision = "0s"
    hostname = ""
    omit_hostname = false

[[inputs.cpu]]
    percpu = true
    totalcpu = true
    collect_cpu_time = false
    report_active = false
    core_tags = false
[[inputs.disk]]
    ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]
[[inputs.diskio]]
[[inputs.kernel]]
[[inputs.mem]]
[[inputs.processes]]
    use_sudo = false
[[inputs.swap]]
[[inputs.system]]
[[inputs.net]]
    interfaces=["en*","eth*","wl*","wg*"]
    # ignore_protocol_stats=false
[[inputs.temp]]

# [[processors.regex]]
#   [[processors.regex.metric_rename]]
#     pattern = "^(.*)$"
#     replacement = "telegraf_$1"

[[outputs.influxdb_v2]]
    urls = ["${INFLUXDB_URL}"]
    token = "${INFLUXDB_TOKEN}"
    organization = "${INFLUXDB_ORG}"
    bucket = "${INFLUXDB_BUCKET}"
