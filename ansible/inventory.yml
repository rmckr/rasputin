---
# The homelab host: a Debian guest, e.g. under Proxmox.
# Set ansible_host to the guest's IP before running.
homelab:
  hosts:
    rasputin:
      ansible_host: 192.168.2.102
      # SSH account (must have sudo: the play runs become: true).
      # Same identity as homelab_user here; only change this if you log
      # in as someone else (root, personal account).
      ansible_user: rasputin
      # Branch the bootstrap clone tracks (site.yml reads
      # `repo_version | default('main')`). Uncomment here (host var) or
      # under `homelab: vars:` (group var) - both tested working. NOT at
      # top level: Ansible skips top-level scalars as invalid groups.
      repo_version: test/deploy-vm
# homelab_user (the host service account the playbook creates - default
# rasputin) is a play var in site.yml, so inventory cannot override it;
# use -e homelab_user=othername.
