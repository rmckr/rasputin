name: core

# Fails the deploy instead of rendering empty hostnames when .env isn't in
# scope. Komodo passes --env-file .env when the stack's run directory is the
# repo root and its env file path is .env (the default).
x-required-config: "${HOMELAB_DOMAIN:?HOMELAB_* missing from .env - run scripts/render.sh}"

include:
  - ../services/core/pihole/compose.yaml
  - ../services/core/traefik/compose.yaml
  - ../services/core/unbound/compose.yaml
  # - ../services/core/wireguard/compose.yaml
  - ../services/core/wireguard-client/compose.yaml

networks:
  proxy:
    external: true
  dns:
    external: true
  pihole:
    external: true
