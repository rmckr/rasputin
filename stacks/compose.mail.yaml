name: mail

# See compose.core.yaml - fails fast when .env isn't in scope.
x-required-config: "${HOMELAB_DOMAIN:?HOMELAB_* missing from .env - run scripts/render.sh}"

include:
  - ../services/mail/dovecot/compose.yaml
  - ../services/mail/imapsync/compose.yaml
  - ../services/mail/rspamd/compose.yaml
  - ../services/mail/rspamd-iscan/compose.yaml

networks:
  proxy:
    external: true
  dns:
    external: true
  mail_filter:
    external: true
  mail_archive:
    external: true
