name: networks

# Bootstrap stack: creates every network the other stacks join as external.
# Deploy BEFORE everything else - Komodo's core joins `proxy`.
#
# compose only creates networks a service actually joins, hence the one-shot
# init container. In Komodo, list `networks-init` under "Ignore Services" or
# the exited container marks the stack unhealthy.
#
# Networks created outside compose break `up` with "incorrect label";
# removal procedure lives in docs/komodo.md (Bootstrap).

services:
  networks-init:
    image: busybox:1.37
    command: ["true"]
    restart: "no"
    networks:
      - proxy
      - dns
      - pihole
      - mail_filter
      - mail_archive
      - metrics

networks:
  proxy:
    name: proxy
  dns:
    name: dns
  pihole:
    name: pihole
  mail_filter:
    name: mail_filter
  mail_archive:
    name: mail_archive
  metrics:
    name: metrics
