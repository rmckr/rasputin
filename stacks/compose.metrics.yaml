name: metrics

# See compose.core.yaml - fails fast when .env isn't in scope.
x-required-config: "${HOMELAB_DOMAIN:?HOMELAB_* missing from .env - run scripts/render.sh}"

include:
  - ../services/metrics/grafana/compose.yaml
  - ../services/metrics/influxdb/compose.yaml
  - ../services/metrics/pihole-influxdb-monitor/compose.yaml
  - ../services/metrics/telegraf/compose.yaml
  - ../services/metrics/wg-clients/compose.yaml

networks:
  proxy:
    external: true
  pihole:
    external: true
  metrics:
    external: true
