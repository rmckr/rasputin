site_name: Rasputin
site_description: A personal homelab repository for managing and documenting home infrastructure and services.
site_url: https://rmckr.github.io/rasputin/

repo_url: https://github.com/rmckr/rasputin
repo_name: rmckr/rasputin

theme:
  name: material
  palette:
    - scheme: slate
      primary: red
      accent: red
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
  icon:
    repo: fontawesome/brands/git-alt

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md

  - Initial setup:
    - Initial setup: initial-setup.md

  - Infrastructure:
    - Architecture: architecture.md
    - Stacks & Services: generated/services.md
    - Networking: generated/networking.md

  - Operations:
    - Environment Secrets: environment-secrets.md
    - Komodo: komodo.md
    - Local debugging: generated/local-debugging.md