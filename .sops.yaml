---
# SOPS configuration for Rasputin.
# Recipients: primary age key + offline recovery key (see docs/environment-secrets.md).
#
# One rule, one env file: the plaintext .env (config + all secrets,
# including Komodo's) is encrypted to .env.enc.
creation_rules:
  # unencrypted_regex is an ALLOW-list: only HOMELAB_* stays readable so
  # `git diff .env.enc` shows real config changes; every credential is
  # sealed by default, including keys added later. The MAC still covers the
  # plaintext values, so editing one makes decrypt fail with a mismatch.
  # (sops always encrypts comments in dotenv files, whatever the regex says.)
  - path_regex: \.env$
    unencrypted_regex: '^HOMELAB_'
    age: >-
      age15etzrgqhxedapvpx2y3as9evc39zv25lltn78r2m2l9k2hupaq6qf05wa7,
      age17gjk76j9qempqsyhsjzraq8zkas2r64nc2ulcv04rkkcjvzd9dkq3gyez9
